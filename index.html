<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MINION MODE 🧌</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: #0a0612;
    background-image: radial-gradient(circle at 50% -10%, #3a2166 0%, #1a0f2e 45%, #07040e 100%);
    font-family: 'Segoe UI', Roboto, sans-serif; color: #fff; user-select: none;
    touch-action: manipulation; overflow: hidden; position: relative;
  }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(2px 2px at 18% 28%, #fff9 0%, transparent 100%),
      radial-gradient(2px 2px at 72% 12%, #fff7 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 88% 52%, #fff6 0%, transparent 100%),
      radial-gradient(2px 2px at 32% 74%, #fff8 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 58% 38%, #fff5 0%, transparent 100%),
      radial-gradient(2px 2px at 8% 60%, #fff6 0%, transparent 100%);
    animation: twinkle 3.5s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity: .35; } to { opacity: 1; } }

  .wrap { position: relative; z-index: 2; display: flex; width: 100%; height: 100%; }

  .stage {
    flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; align-items: center;
    padding: max(16px, env(safe-area-inset-top)) 14px 10px; position: relative;
  }
  #spec { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .orbzone {
    position: relative; width: min(72vmin, 400px); aspect-ratio: 1;
    flex: 0 0 auto; margin-top: 2vmin; z-index: 1;
  }
  .orbglow {
    position: absolute; inset: -12%; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, #ff2ee620 0%, #7b5cff10 45%, transparent 70%);
    filter: blur(6px);
  }
  .orb {
    position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
    background: radial-gradient(circle at 50% 30%, #1c1030 0%, #100a1c 62%, #080410 100%);
    border: 3px solid #fff;
    box-shadow: 0 0 16px #ffffff80, 0 0 40px #c9a2ff4d, inset 0 0 40px #000c;
    will-change: transform;
  }
  .orb img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center 30%;
    will-change: transform;
  }
  #orbflash {
    position: absolute; inset: -1px; border-radius: 50%; pointer-events: none;
    box-shadow: 0 0 26px 6px #ffffffcc, 0 0 70px 14px #ff2ee6aa;
    opacity: 0;
  }
  .now {
    margin-top: 16px; max-width: 92vw; text-align: center; z-index: 2;
    font-size: clamp(16px, 4.6vw, 23px); font-weight: 600; letter-spacing: .04em;
    text-shadow: 0 0 16px #ff2ee677; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .progwrap { width: min(88vw, 430px); margin-top: 12px; z-index: 2; }
  .bar { width: 100%; height: 8px; background: #ffffff1e; border-radius: 4px; overflow: hidden; cursor: pointer; }
  .bar .fill { display: block; height: 100%; width: 0%; border-radius: 4px;
    background: linear-gradient(90deg, #35e0ff, #ff2ee6); box-shadow: 0 0 12px #ff2ee688; transition: width .12s linear; }
  .time { display: flex; justify-content: space-between; font-size: 12px; color: #ffffff99; margin-top: 6px; }
  .controls { display: flex; align-items: center; justify-content: center; gap: 24px; margin-top: 10px; z-index: 3; }
  .cbtn {
    width: 50px; height: 50px; border-radius: 50%; border: 1px solid #ffffff2a;
    background: #ffffff12; backdrop-filter: blur(8px); color: #fff; font-size: 21px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform .12s;
  }
  .cbtn:active { transform: scale(.9); }
  .cbtn.main { width: 70px; height: 70px; font-size: 29px;
    background: linear-gradient(145deg, #35e0ff, #ff2ee6); color: #fff; border: none;
    box-shadow: 0 6px 24px #ff2ee666; }
  .hint { margin-top: 10px; font-size: 13px; color: #ffffffb0; animation: blink 1.8s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  #err { margin-top: 8px; font-size: 13px; color: #ff9c9c; display: none; text-align: center; }

  .playlist {
    flex: 0 0 320px; width: 320px; display: flex; flex-direction: column;
    border-left: 1px solid #ffffff14; background: #ffffff08; backdrop-filter: blur(14px);
    overflow: hidden;
  }
  .pl-head {
    padding: 16px 18px 10px; font-size: 13px; letter-spacing: .18em; color: #ffffff77;
    text-transform: uppercase; border-bottom: 1px solid #ffffff10;
  }
  .pl-list { flex: 1; overflow-y: auto; padding: 10px 12px calc(14px + env(safe-area-inset-bottom)); }
  .pl-list::-webkit-scrollbar { width: 4px; }
  .pl-list::-webkit-scrollbar-thumb { background: #ffffff22; border-radius: 2px; }
  .row {
    display: flex; align-items: center; gap: 12px; padding: 12px 13px; margin-bottom: 8px;
    background: #ffffff0e; border: 1px solid #ffffff12; border-radius: 13px;
    cursor: pointer; transition: background .2s, transform .12s;
  }
  .row:active { transform: scale(.98); }
  .row.active { background: #ff2ee622; border-color: #ff2ee666; }
  .row .num { font-size: 12px; color: #ffffff66; width: 18px; text-align: center; }
  .row .name { flex: 1; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.active .name { color: #35e0ff; }
  .eq { display: none; gap: 2px; align-items: flex-end; height: 15px; }
  .row.active.playing .eq { display: flex; }
  .eq i { width: 3px; background: #35e0ff; border-radius: 1px; animation: eq .7s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: .2s; } .eq i:nth-child(3) { animation-delay: .4s; }
  @keyframes eq { 0%,100% { height: 4px; } 50% { height: 15px; } }

  .pl-toggle {
    display: none; position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom));
    z-index: 11; width: 56px; height: 56px; border-radius: 50%; border: 1px solid #ffffff2a;
    background: #ff2ee6e6; color: #fff; font-size: 24px; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px #000a; cursor: pointer;
  }
  @media (max-width: 719px) {
    .playlist {
      position: fixed; right: 0; top: 0; bottom: 0; width: min(84vw, 330px);
      transform: translateX(102%); transition: transform .3s cubic-bezier(.2,.8,.2,1);
      background: #140c20f2; border-left: 1px solid #ffffff20; z-index: 10;
    }
    body.playlist-open .playlist { transform: none; }
    body.playlist-open::after { content: ''; position: fixed; inset: 0; z-index: 9; background: #0009; }
    .pl-toggle { display: flex; }
    .orbzone { width: min(74vmin, 380px); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="stage" id="stage">
      <canvas id="spec"></canvas>
      <div class="orbzone">
        <div class="orbglow"></div>
        <div class="orb" id="orb">
          <img id="minion" src="minion_face.png" alt="minion">
        </div>
        <div id="orbflash"></div>
      </div>
      <div class="now" id="now">Тапни — поедет музыка</div>
      <div class="progwrap">
        <div class="bar" id="bar"><span class="fill" id="fill"></span></div>
        <div class="time"><span id="tcur">0:00</span><span id="ttot">0:00</span></div>
      </div>
      <div class="controls">
        <div class="cbtn" id="prev">⏮</div>
        <div class="cbtn main" id="play">▶</div>
        <div class="cbtn" id="next">⏭</div>
      </div>
      <div class="hint" id="hint">тапни по кругу или треку 🎵</div>
      <div id="err"></div>
    </div>
    <div class="playlist" id="playlist">
      <div class="pl-head">Плейлист · 8</div>
      <div class="pl-list" id="list"></div>
    </div>
  </div>
  <div class="pl-toggle" id="plToggle">☰</div>
  <audio id="audio" preload="auto" crossorigin="anonymous"></audio>
<script>
  const TRACKS = [
    { file: '01_chicken_gan.mp3',  name: 'Песня про чикен ган' },
    { file: '02_zastoy.mp3',       name: 'Застой' },
    { file: '03_maslennikov.mp3',  name: 'Утерянное видео Масленникова' },
    { file: '04_bucha.mp3',        name: 'Буча' },
    { file: '05_tarantino.mp3',    name: 'Тарантиновский монолог' },
    { file: '06_verity.mp3',       name: 'Верити (оригинал)' },
    { file: '07_pension.mp3',      name: 'Пенсионный возраст' },
    { file: '08_koch_bratan.mp3',  name: 'У коч братан боли' }
  ];
  const audio = document.getElementById('audio');
  const stage = document.getElementById('stage');
  const nowEl = document.getElementById('now');
  const fill = document.getElementById('fill');
  const bar = document.getElementById('bar');
  const tcur = document.getElementById('tcur');
  const ttot = document.getElementById('ttot');
  const playBtn = document.getElementById('play');
  const hint = document.getElementById('hint');
  const err = document.getElementById('err');
  const orb = document.getElementById('orb');
  const minion = document.getElementById('minion');
  const orbflash = document.getElementById('orbflash');
  const spec = document.getElementById('spec');
  const sctx = spec.getContext('2d');
  let idx = 0, playing = false;

  /* ——— аудио-граф ——— */
  let actx = null, analyser = null, tdata = null, freq = null;
  function initAnalyser() {
    if (actx) return;
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      const src = actx.createMediaElementSource(audio);
      analyser = actx.createAnalyser();
      analyser.fftSize = 1024;
      analyser.smoothingTimeConstant = 0.78;
      src.connect(analyser); analyser.connect(actx.destination);
      tdata = new Uint8Array(analyser.fftSize);
      freq = new Uint8Array(analyser.frequencyBinCount);
    } catch (e) { /* без реактива тоже проживёт */ }
  }

  /* ——— геометрия: считаем один раз на изменение размера ——— */
  let sw = 0, sh = 0, cx = 0, cy = 0, Rorb = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    const srect = stage.getBoundingClientRect();
    const orect = orb.getBoundingClientRect();
    sw = Math.round(srect.width * dpr); sh = Math.round(srect.height * dpr);
    if (spec.width !== sw || spec.height !== sh) { spec.width = sw; spec.height = sh; }
    cx = (orect.left + orect.width / 2 - srect.left) * dpr;
    cy = (orect.top + orect.height / 2 - srect.top) * dpr;
    Rorb = orect.width / 2 * dpr;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 250));

  /* ——— пульс: бас против своей средней — колотится даже на тихой громкости ——— */
  let lvl = 0, kick = 0, t0 = performance.now();
  const bassHist = []; let lastBeat = 0;

  let lastW = 0, lastH = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (stage.clientWidth !== lastW || stage.clientHeight !== lastH) {
      lastW = stage.clientWidth; lastH = stage.clientHeight;
      resize();
    }
    let target = 0;
    if (analyser && playing) {
      analyser.getByteTimeDomainData(tdata);
      analyser.getByteFrequencyData(freq);
      let sum = 0;
      for (let i = 0; i < tdata.length; i++) { const d = tdata[i] - 128; sum += d * d; }
      target = Math.min(1, Math.sqrt(sum / tdata.length) * 3.4);
      let bass = 0;
      for (let i = 2; i < 26; i++) bass += freq[i];
      bass /= 24 * 255;
      bassHist.push(bass); if (bassHist.length > 45) bassHist.shift();
      let avg = 0; for (const b of bassHist) avg += b; avg /= bassHist.length;
      if (bass > avg * 1.22 + 0.015 && now - lastBeat > 170) { kick = 1; lastBeat = now; }
    } else {
      target = 0.08 + 0.05 * Math.sin((now - t0) / 700);
    }
    kick *= 0.9;
    lvl += (target - lvl) * (target > lvl ? 0.5 : 0.14);

    /* неоновое кольцо-спектр: палки до границы экрана, никогда не режутся */
    sctx.clearRect(0, 0, sw, sh);
    if (sw > 0 && Rorb > 0) {
      const N = 60, lw = Math.max(2, sw / 260);
      const R0 = Rorb * 1.06;
      for (let i = 0; i < N; i++) {
        const a = (i / N) * 6.2832 - Math.PI / 2;
        const c = Math.cos(a), s = Math.sin(a);
        let dist = 1e9;
        if (c > 0.001) dist = Math.min(dist, (sw - cx) / c);
        if (c < -0.001) dist = Math.min(dist, cx / -c);
        if (s > 0.001) dist = Math.min(dist, (sh - cy) / s);
        if (s < -0.001) dist = Math.min(dist, cy / -s);
        const maxLen = Math.max(3, dist - R0 - 5 * dpr);
        let v;
        if (analyser && playing) {
          const bin = Math.floor(Math.pow(i / N, 1.35) * (freq.length * 0.7));
          v = freq[bin] / 255;
        } else {
          v = 0.08 + 0.06 * Math.sin(now / 480 + i * 0.55);
        }
        v = Math.max(v, 0.03);
        const hue = 285 - (i / N) * 95;
        const x1 = cx + c * R0, y1 = cy + s * R0;
        const x2 = cx + c * (R0 + maxLen * v), y2 = cy + s * (R0 + maxLen * v);
        const x3 = cx + c * (R0 + maxLen * v * 1.9 + lw * 2), y3 = cy + s * (R0 + maxLen * v * 1.9 + lw * 2);
        /* глоу (широкий полупрозрачный штрих вместо shadowBlur — быстро) */
        sctx.strokeStyle = 'hsla(' + hue + ',100%,60%,' + (0.16 + v * 0.25 + kick * 0.15) + ')';
        sctx.lineWidth = lw * 3.2;
        sctx.beginPath(); sctx.moveTo(x1, y1); sctx.lineTo(x3, y3); sctx.stroke();
        /* ядро */
        sctx.strokeStyle = 'hsla(' + hue + ',100%,' + (60 + v * 20) + '%,' + (0.65 + v * 0.35) + ')';
        sctx.lineWidth = lw;
        sctx.beginPath(); sctx.moveTo(x1, y1); sctx.lineTo(x2, y2); sctx.stroke();
      }
    }

    /* вспышка на бите и пульс круга */
    orbflash.style.opacity = Math.min(1, kick * 0.9);
    const s = 1 + lvl * 0.04 + kick * 0.06;
    orb.style.transform = 'scale(' + s + ')';
    if (playing) {
      minion.style.transform = 'scale(' + (1 + lvl * 0.12 + kick * 0.1) + ') translateY(' + (-kick * 6) + 'px)';
    } else {
      minion.style.transform = 'scale(' + (1 + lvl * 0.08) + ')';
    }
  }
  requestAnimationFrame(frame);

  /* ——— плеер ——— */
  function fmt(s) {
    if (!isFinite(s)) return '0:00';
    s = Math.floor(s);
    return Math.floor(s/60) + ':' + String(s%60).padStart(2, '0');
  }
  function renderList() {
    const list = document.getElementById('list');
    list.innerHTML = '';
    TRACKS.forEach((t, i) => {
      const row = document.createElement('div');
      row.className = 'row' + (i === idx ? ' active' : '') + (i === idx && playing ? ' playing' : '');
      row.innerHTML = '<span class="num">' + (i+1) + '</span><span class="name">' + t.name +
                      '</span><span class="eq"><i></i><i></i><i></i></span>';
      row.addEventListener('pointerup', e => { e.stopPropagation(); play(i); });
      list.appendChild(row);
      if (i === idx) row.scrollIntoView({ block: 'nearest' });
    });
  }
  function load(i, autoplay) {
    idx = (i + TRACKS.length) % TRACKS.length;
    audio.src = TRACKS[idx].file;
    nowEl.textContent = TRACKS[idx].name;
    fill.style.width = '0%'; tcur.textContent = '0:00'; ttot.textContent = '0:00';
    renderList();
    if (autoplay) start();
  }
  function start() {
    initAnalyser();
    if (actx && actx.state === 'suspended') actx.resume();
    audio.play().then(() => {
      playing = true; playBtn.textContent = '⏸';
      hint.style.display = 'none';
      renderList();
    }).catch(e => {
      err.style.display = 'block';
      err.textContent = 'Не завелось: ' + (audio.error ? 'файл трека битый' : e);
    });
  }
  function pause() {
    audio.pause(); playing = false; playBtn.textContent = '▶';
    renderList();
  }
  function play(i) { load(i, true); }

  document.getElementById('stage').addEventListener('pointerup', () => playing ? pause() : start());
  playBtn.addEventListener('pointerup', e => { e.stopPropagation(); playing ? pause() : start(); });
  document.getElementById('next').addEventListener('pointerup', e => { e.stopPropagation(); play(idx + 1); });
  document.getElementById('prev').addEventListener('pointerup', e => { e.stopPropagation(); play(idx - 1); });
  document.getElementById('plToggle').addEventListener('pointerup', e => {
    e.stopPropagation(); document.body.classList.toggle('playlist-open');
  });
  document.getElementById('playlist').addEventListener('pointerup', e => e.stopPropagation());
  document.body.addEventListener('pointerup', e => {
    if (document.body.classList.contains('playlist-open') &&
        !document.getElementById('playlist').contains(e.target) &&
        !document.getElementById('plToggle').contains(e.target)) {
      document.body.classList.remove('playlist-open');
    }
  });
  bar.addEventListener('pointerup', e => {
    e.stopPropagation();
    const r = bar.getBoundingClientRect();
    if (isFinite(audio.duration)) audio.currentTime = (e.clientX - r.left) / r.width * audio.duration;
  });
  audio.addEventListener('timeupdate', () => {
    if (isFinite(audio.duration)) {
      fill.style.width = (audio.currentTime / audio.duration * 100) + '%';
      tcur.textContent = fmt(audio.currentTime);
      ttot.textContent = fmt(audio.duration);
    }
  });
  audio.addEventListener('ended', () => play(idx + 1));

  load(0, false);
</script>
</body>
</html>
